<style>
:root {
  /* Primitive · 原子色 */
  --rose-50:#fdf5f0; --rose-100:#f9e3d4; --rose-200:#f1c4a8;
  --rose-300:#e89e76; --rose-400:#d9774b; --rose-500:#c2410c;
  --rose-600:#a8340a; --rose-700:#872a08; --rose-800:#6a1f06; --rose-900:#4a1605;

  --cream-300:#e8dcc6; --cream-400:#d6c4a3; --cream-500:#b8a17e;
  --cream-600:#8e7752; --cream-700:#66553b; --cream-800:#3f3322; --cream-900:#231b10;
  --stone-50:#f8f6f3; --stone-100:#ede8e0; --stone-200:#d9d2c5;
  --stone-300:#b8aea0; --stone-400:#928676; --stone-500:#6b6051;

  --legendary-300:#e8d49b; --legendary-500:#c1932e; --legendary-700:#8a6618;
  --ink-500:#2f456a; --ink-700:#1a2942;
  /* Semantic */
  --color-primary:var(--rose-500);
  --color-primary-dark:var(--rose-600);
  --color-primary-rgb:194,65,12;
  --color-text:var(--stone-700);
  --color-text-muted:var(--stone-500);
  --color-text-subtle:var(--stone-400);
  --color-text-rose:var(--rose-500);
  --color-border:var(--cream-300);
  --color-border-subtle:var(--cream-200);
  --color-border-strong:var(--cream-400);
  --color-bg:var(--cream-100);
  --color-bg-elevated:var(--cream-50);
  /* Spacing */
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px; --space-8:40px;
  --space-9:48px; --space-10:56px; --space-11:64px; --space-12:80px;
  /* Radius */
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-2xl:28px; --radius-full:9999px;
  /* Type */
  --font-cn:"LXGW WenKai","Source Han Serif SC","Songti SC","Noto Serif CJK SC","STSong",serif;
  --font-en:"Inter","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-mono:"Berkeley Mono","JetBrains Mono","SF Mono","Menlo",monospace;
  /* Motion */
  --dur-fast:180ms; --dur-base:280ms; --dur-slow:480ms;
  --dur-deliberate:720ms; --dur-ceremony:1200ms;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --ease-breath:cubic-bezier(0.45,0,0.55,1);
  /* Depth */
  --shadow-sm:0 2px 6px rgba(194,65,12,0.06);
  --shadow-md:0 6px 18px rgba(194,65,12,0.10);
  --shadow-lg:0 12px 32px rgba(194,65,12,0.14);
  --shadow-xl:0 24px 48px rgba(194,65,12,0.18);
  --shadow-glow-rose:0 0 24px rgba(194,65,12,0.25);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { background:#3f3322; }
body { font-family:var(--font-cn); color:var(--color-text); line-height:1.6; -webkit-font-smoothing:antialiased; }

/* ======= 设备外框 ======= */
.stage {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px;
  background:radial-gradient(ellipse at center, #4a1605 0%, #231b10 100%);
}
.stage-label {
  position:fixed;
  top:16px;
  left:24px;
  color:var(--cream-300);
  font-family:var(--font-en);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
}
.stage-tag {
  position:fixed;
  top:16px;
  right:24px;
  color:var(--rose-300);
  font-family:var(--font-en);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
}
.phone {
  width:390px;
  height:844px;
  background:var(--color-bg);
  border-radius:48px;
  box-shadow:
    0 0 0 10px #1a1610,
    0 0 0 11px #3f3322,
    0 60px 120px rgba(0,0,0,0.45);
  overflow:hidden;
  position:relative;
}

/* ======= iOS Status Bar ======= */
.status-bar {
  height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  font-family:var(--font-en);
  font-size:15px;
  font-weight:600;
  color:var(--stone-800);
  position:relative;
  z-index:10;
}
.status-bar .icons { display:flex; gap:6px; align-items:center; }
.signal { letter-spacing:-1px; font-size:14px; }

/* ======= 登录页主体 ======= */
.login-screen {
  height:800px;
  background:var(--color-bg);
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 32px;
  overflow:hidden;
}

/* 顶部柔光背景 */
.login-screen::before {
  content:"";
  position:absolute;
  top:-180px;
  left:50%;
  transform:translateX(-50%);
  width:520px;
  height:520px;
  background:radial-gradient(circle, rgba(249,227,212,0.55) 0%, rgba(249,227,212,0) 70%);
  pointer-events:none;
}

/* 纸纹背景（极淡颗粒） */
.login-screen::after {
  content:"";
  position:absolute;
  inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.06'/></svg>");
  opacity:0.6;
  pointer-events:none;
  mix-blend-mode:multiply;
}

/* ======= 双心交错品牌符号 ======= */
.brand-mark {
  margin-top:96px;
  position:relative;
  width:96px;
  height:96px;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:breath 4800ms var(--ease-breath) infinite;
}
.brand-mark svg {
  position:absolute;
  width:96px;
  height:96px;
}
.brand-mark .heart-r {
  animation:breath-r 4800ms var(--ease-breath) infinite;
}
@keyframes breath {
  0%,100% { transform:scale(1); }
  50% { transform:scale(1.04); }
}
@keyframes breath-r {
  0%,100% { transform:translate(0,0) scale(0.92); opacity:0.7; }
  50% { transform:translate(2px,1px) scale(0.94); opacity:0.78; }
}

/* ======= 标题 ======= */
.welcome {
  margin-top:40px;
  text-align:center;
  position:relative;
  z-index:2;
}
.welcome .overline {
  font-family:var(--font-en);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.24em;
  text-transform:uppercase;
  color:var(--color-text-subtle);
  margin-bottom:12px;
}
.welcome h1 {
  font-family:var(--font-cn);
  font-size:36px;
  font-weight:600;
  color:var(--color-text);
  line-height:1.25;
  letter-spacing:-0.01em;
}
.welcome h1 em {
  font-style:normal;
  color:var(--color-text-rose);
  font-weight:700;
}
.welcome .sub {
  margin-top:16px;
  font-family:var(--font-cn);
  font-size:15px;
  color:var(--color-text-muted);
  line-height:1.7;
}

/* ======= 表单卡片 ======= */
.form-card {
  margin-top:48px;
  width:100%;
  background:var(--color-bg-elevated);
  border:1px solid var(--color-border-subtle);
  border-radius:var(--radius-lg);
  padding:28px 24px;
  box-shadow:var(--shadow-sm);
  position:relative;
  z-index:2;
}
.field { margin-bottom:18px; position:relative; }
.field-label {
  font-family:var(--font-en);
  font-size:11px;
  font-weight:600;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--color-text-subtle);
  margin-bottom:8px;
  display:block;
}
.field-input {
  width:100%;
  height:48px;
  background:var(--cream-50);
  border:1px solid var(--color-border);
  border-radius:var(--radius-sm);
  padding:0 16px;
  font-family:var(--font-en);
  font-size:15px;
  color:var(--color-text);
  display:flex;
  align-items:center;
  position:relative;
}
.field-input.partner { padding-left:46px; }
.field-input .partner-mark {
  position:absolute;
  left:14px;
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.field-input .placeholder {
  color:var(--color-text-subtle);
  font-family:var(--font-cn);
  font-size:14px;
}
.field-input .placeholder-en {
  color:var(--color-text-subtle);
  font-family:var(--font-en);
  font-size:13px;
  letter-spacing:0.04em;
}
.field-input .helper {
  margin-left:auto;
  color:var(--color-text-subtle);
  font-family:var(--font-en);
  font-size:12px;
}
.divider {
  height:1px;
  background:var(--color-border-subtle);
  margin:20px 0 18px;
  position:relative;
}
.divider .or {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:var(--color-bg-elevated);
  padding:0 12px;
  font-family:var(--font-en);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--color-text-subtle);
}

/* ======= 按钮 ======= */
.btn-primary {
  width:100%;
  height:52px;
  background:var(--color-primary);
  color:var(--cream-50);
  border:none;
  border-radius:var(--radius-sm);
  font-family:var(--font-cn);
  font-size:15px;
  font-weight:600;
  letter-spacing:0.04em;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  box-shadow:var(--shadow-md);
  position:relative;
  overflow:hidden;
  transition:transform var(--dur-fast) var(--ease-out);
}
.btn-primary::after {
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center, rgba(255,255,255,0.18), transparent 70%);
  opacity:0;
  transition:opacity var(--dur-fast);
}
.btn-primary:hover { transform:translateY(-1px); box-shadow:var(--shadow-lg); }
.btn-primary:hover::after { opacity:1; }
.btn-primary:active { transform:scale(0.97); }

.btn-ghost {
  margin-top:12px;
  width:100%;
  height:48px;
  background:transparent;
  color:var(--color-text-muted);
  border:1px solid var(--color-border);
  border-radius:var(--radius-sm);
  font-family:var(--font-cn);
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.btn-ghost .dot {
  width:6px;
  height:6px;
  background:var(--rose-500);
  border-radius:50%;
  margin-right:8px;
}

/* ======= 底部小字 + 仪式点缀 ======= */
.legal {
  margin-top:auto;
  margin-bottom:24px;
  text-align:center;
  font-family:var(--font-cn);
  font-size:12px;
  color:var(--color-text-subtle);
  line-height:1.7;
  position:relative;
  z-index:2;
}
.legal .stamp {
  display:inline-block;
  margin:0 4px;
  font-family:var(--font-en);
  font-size:10px;
  font-weight:600;
  letter-spacing:0.18em;
  color:var(--legendary-700);
  border:1.5px solid var(--legendary-700);
  padding:2px 6px;
  border-radius:3px;
  transform:rotate(-3deg);
  background:rgba(193,147,46,0.06);
}
.legal-link {
  color:var(--stone-600);
  text-decoration:underline;
  text-underline-offset:3px;
  text-decoration-color:var(--stone-300);
  text-decoration-thickness:1px;
  transition:color var(--dur-fast) var(--ease-out);
}
.legal-link:hover {
  color:var(--rose-500);
  text-decoration-color:var(--rose-300);
}

/* ======= 角落装饰花瓣 ======= */
.petal-deco {
  position:absolute;
  width:120px;
  height:120px;
  opacity:0.5;
  pointer-events:none;
  z-index:1;
}
.petal-deco.tl { top:120px; left:-40px; transform:rotate(-30deg); }
.petal-deco.br { bottom:80px; right:-40px; transform:rotate(160deg); }

/* 底部一行情诗 */
.poem {
  margin-top:20px;
  text-align:center;
  font-family:var(--font-cn);
  font-style:italic;
  font-size:13px;
  color:var(--color-text-subtle);
  letter-spacing:0.04em;
  position:relative;
  z-index:2;
}

/* ======= 指纹登录提示 ======= */
.touch-id {
  position:absolute;
  bottom:36px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  z-index:2;
}
.touch-id .icon {
  width:36px;
  height:36px;
  border:1.5px solid var(--rose-400);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--rose-500);
  animation:breath 4800ms var(--ease-breath) infinite;
}
.touch-id .txt {
  font-family:var(--font-en);
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  color:var(--color-text-subtle);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:120ms !important;
    transition-duration:120ms !important;
  }
}
</style>
