name: APP E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'
      - '.github/workflows/e2e-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'

# 同一分支/PR 只保留最新一次运行，避免重复触发浪费时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 阶段 3.5：只验证 CI 环境能构建 APK（不含模拟器 + 测试）
# 阶段 3.6：构建验证通过后，再逐步加回 Appium + 模拟器 + 测试

jobs:
  e2e-app:
    name: APP E2E (Appium)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-e2e/package-lock.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install app-e2e dependencies
        run: cd app-e2e && npm ci

      - name: Install root dependencies (for cap sync)
        run: npm install --ignore-scripts

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home=$JAVA_HOME

      # ===== 阶段 3.6 启用（构建验证通过后取消注释）=====
      # - name: Start Appium server
      # - name: Start Android emulator
      # - name: Run APP E2E tests
      # - name: Upload Allure results
      # - name: Generate Allure report
      # - name: Upload failure screenshots
