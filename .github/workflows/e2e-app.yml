name: APP E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'
      - 'android/**'
      - '.github/workflows/e2e-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'
      - 'android/**'

# 同一分支/PR 只保留最新一次运行，避免重复触发浪费时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Job 1: 构建测试专用 APK（build-test-apk.mjs，与本地一致）
  # ============================================================
  build:
    name: Build Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Restore keystore for release signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > love-todo.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../../love-todo.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          # 移除 heredoc 缩进
          sed -i 's/^          //' android/keystore.properties
          echo "✓ keystore.properties 已生成"

      - name: Fix Java home for CI
        run: |
          # gradle.properties 硬编码了本地 Mac 的 Java 路径，CI 上不存在
          sed -i "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties
          echo "✓ Java home 已设为 $JAVA_HOME"

      - name: Generate .env.test
        run: |
          printf '%s\n' \
            "E2E_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}" \
            "E2E_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}" \
            "E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" \
            "E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}" \
            "E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}" \
            > app-e2e/.env.test
          echo "✓ .env.test 已生成"

      - name: Build test APK (build-test-apk.mjs)
        run: node scripts/build-test-apk.mjs

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  # ============================================================
  # Job 2: APP E2E 测试（阶段 3.6：模拟器 + Appium + 测试）
  # ============================================================
  test:
    name: APP E2E (Appium)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test APK
        uses: actions/download-artifact@v4
        with:
          name: test-apk
          path: android/app/build/outputs/apk/release/

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-e2e/package-lock.json

      - name: Install app-e2e dependencies
        run: cd app-e2e && npm ci

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list --installed

      - name: Generate .env.test
        run: |
          printf '%s\n' \
            "E2E_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}" \
            "E2E_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}" \
            "E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" \
            "E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}" \
            "E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}" \
            > app-e2e/.env.test

      # 快速失败：测试库 schema 漂移会让 App 查询静默失败、E2E 报「元素找不到」，
      # 排查成本极高。这里在起模拟器之前就校验，几十秒内给出可执行的修复 SQL。
      - name: Check test DB schema (fail fast)
        run: cd app-e2e && node scripts/check-test-schema.mjs
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # 设置测试环境变量（覆盖 wdio.conf.js 的默认设备名）
            export DEVICE_NAME="emulator-5554"
            export ANDROID_HOME="$ANDROID_HOME"

            # 运行测试（脚本内部管理 Appium 生命周期）
            bash app-e2e/scripts/ci-run.sh

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: app-e2e/allure-results/
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: |
          cd app-e2e
          npx allure generate allure-results --clean --report-dir allure-report || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: app-e2e/allure-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: |
            app-e2e/allure-results/**/*.png
          retention-days: 7
