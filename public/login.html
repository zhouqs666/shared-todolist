<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>登录 · 我们的清单</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="login">
    <div class="login__card">
      <div class="login__emoji">📋</div>
      <h1 class="login__title">我们的清单</h1>
      <p class="login__subtitle">登录后开始协作</p>

      <form id="loginForm" class="login__form" novalidate>
        <label class="field">
          <span class="field__label">用户名</span>
          <input
            id="username"
            name="username"
            class="field__input"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            required
          />
        </label>

        <label class="field">
          <span class="field__label">密码</span>
          <input
            id="password"
            name="password"
            class="field__input"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <p id="errorMsg" class="login__error" hidden></p>

        <button id="submitBtn" class="login__submit btn btn--primary" type="submit">
          登录
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
