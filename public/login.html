<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10b981" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>登录 · 爱的清单</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <main class="login">
    <div class="login__card">
      <div class="login__heart" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="64" height="64" role="img" aria-label="爱心">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fb7185"/>
              <stop offset="100%" stop-color="#e11d48"/>
            </linearGradient>
          </defs>
          <path d="M16 28s-11-6.6-11-14.2C5 9.2 7.9 6.5 11.3 6.5c2 0 3.8 1 4.7 2.6.9-1.6 2.7-2.6 4.7-2.6C24.1 6.5 27 9.2 27 13.8 27 21.4 16 28 16 28z" fill="url(#heartGrad)"/>
          <path d="M13 11c-1.6 0-3 1.3-3 3" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h1 class="login__title">爱的清单</h1>
      <p class="login__subtitle">一起消灭琐碎事项</p>

      <form id="loginForm" class="login__form" novalidate>
        <label class="field">
          <span class="field__label">用户名</span>
          <input
            id="username"
            name="username"
            class="field__input"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            required
          />
        </label>

        <label class="field">
          <span class="field__label">密码</span>
          <input
            id="password"
            name="password"
            class="field__input"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <p id="errorMsg" class="login__error" hidden></p>

        <button id="submitBtn" class="login__submit btn btn--primary" type="submit">
          登录
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
