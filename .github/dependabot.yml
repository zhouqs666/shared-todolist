# Dependabot 版本更新（批次 D · 供应链安全）
# ============================================================================
# 与「Dependabot alerts / security updates」的区别（面试常被问，也是这里配置的立论）：
#
#   - alerts           ：**看得见**。仓库已有依赖出现 CVE 时告警（本仓库已开）
#   - security updates ：**能止血**。针对已告警的 CVE 自动开 PR 升级（本仓库已开）
#   - version updates  ：**本文件**。不依赖 CVE，按排期主动把依赖升到新版本 ——
#                        目的是「把落后的版本差一点点抹平」，而不是等出了 CVE 再追。
#
# 三者是递进关系，不是重复。前两者是反应式的，本文件是主动式的。
#
# ## 为什么这么配（每一条都有理由，不要随手改）
#
# 1. **minor/patch 合一个 PR，major 各自单独开**
#    合组是降噪：一周开 15 个 PR 没人看，等于没有 Dependabot。
#    但 major 刻意**不**合并 —— major 有 breaking change，合在一个 PR 里一旦 CI 红了
#    没法二分定位是哪个依赖的问题，只能整个 PR 重来。
#
# 2. **排期 weekly + 固定时间（北京时间周一 09:00）**
#    上班第一天就能看到本周的依赖 PR，而不是半夜醒来发现 15 个 PR。
#    同时避开本仓库的定时全量回归（每晚 02:00 北京，见 e2e-web-full.yml）——
#    两者都会往 main 推变更，错开时段能少一次无谓的排队。
#
# 3. **刻意不启用 gradle（android/）的版本更新** —— 这是有意的决定，不是遗漏
#    理由：`android/` 是 Capacitor 生成的工程，AGP / Gradle 版本与 Capacitor 的兼容区间
#    由 **Capacitor 上游**定义，盲升大概率红。而"知道有没有 CVE"这件事已经由
#    Dependabot **alerts** 覆盖（它对 gradle 依赖一样会告警）。
#    结论：原生层只要**可见性**（alerts），不要**自动改代码**（version updates）——
#    自动 PR 的价值是省人力，这里省不下（升不动），只会留下没人能合的 PR。
#
# 4. **`groups` 只管「版本更新」，「安全更新」永远是单开的** —— 这是 GitHub 的默认，也是本仓库有意的选择
#    `groups` 的 `applies-to` 默认只含 `version-updates`。所以安全更新（security updates）会一条一个 PR：
#    这是**好事，别去"修"它** —— 出了严重 CVE 时你要能立刻合那一个 PR，而不是被 7 个无关的小升级拖住，
#    也不能因为其中 1 个红了就整批合不进去。看到 10+ 个单开 PR 时先看标题里有没有 CVE 相关的包名。
#
# 5. **首次运行会是"补课式爆发"**：本文件上线前依赖已经漂了一段时间，所以第一个周一就开出十几条 PR。
#    **这是预期行为，不是噪声失控** —— 稳态每周只会是几条。另外 `open-pull-requests-limit` 是
#    **按 ecosystem 各算各的**（5 个 ecosystem × 5 ≈ 最多 25 条并发），所以刻意压小（3~5）：
#    噪声预算是有限的，这些 PR 每个都要跑 required checks（ci.yml 三个 job），
#    而 app-e2e / android 相关的改动还会触发 ~8 分钟模拟器套件。宁可少开几个、逐个看。
#
# 6. ⚠️ **`update-types: [minor, patch]` 不等于"安全升级"，对 `0.x` 依赖尤其危险**
#    semver 里 `0.x.y` 的**中间位就是 breaking 位**（`^0.21.5` 只允许 `<0.22.0`），
#    而 Dependabot 仍可能把它归进 minor 组。**实测**：`esbuild` 的 `0.21.5 → 0.28.2` 就真的
#    出现在 `root-minor-patch` 组里 —— 而 esbuild 正是打 `public/js/vendor/supabase-js.esm.js`
#    那个**随产品分发**的 bundle 的工具。所以下面给它加了 `exclude-patterns`，让它单独开 PR。
#
# 7. ⚠️ **有些依赖 PR 不是"顺手合并"的**：本仓库的根 `package.json` 里混着两件东西 ——
#    ① 纯开发工具（`@playwright/test`、`esbuild`、`typescript`）
#    ② **随 APK/热更新分发到用户手机的运行时依赖**（`@supabase/supabase-js`、`@capacitor/*`、`@capgo/capacitor-updater`）
#    第 ② 类走的是铁律二/铁律三：要真跑测试；动了 `@supabase/supabase-js` 还得**重新打 vendor bundle**
#    才真正生效（`npm run bundle:supabase`），动了 `@capgo/capacitor-updater`（热更新插件本身）
#    属**原生层**改动 ⇒ 走通道 B 打 APK，不能靠热更新交付。
#    **判断法**：这个包会不会被打进 `public/` 或 `android/`？会 → 按产品改动对待，不是按"chore"对待。
# ============================================================================

version: 2
updates:
  # ── 1. GitHub Actions：**本批次的主角** ────────────────────────────────────
  # 四个工作流里的 action 已全部固定到完整 commit SHA（见 scripts/check-actions-pinned.mjs）。
  # 固定的代价是「再也不会自动变新」—— 由一个不可变的 SHA 换来供应链安全，
  # 但也就意味着**必须有 Dependabot 来推**，否则安全补丁永远进不来。
  # 所以「SHA 固定」和「这条 ecosystem」是一对，缺一个都不成立。
  #
  # Dependabot 认 SHA 的方式：读行尾的 `# v4.4.0` 注释确定当前版本，
  # 升级时**同时改写 SHA 与注释**（所以注释不是装饰，见 check-actions-pinned.mjs 的规则 2）。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # ── 2. 主应用（public/ 侧）：Capacitor 插件 + Supabase SDK + 构建工具 ──────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      root-minor-patch:
        patterns: ['*']
        # esbuild 单独开：0.x 的中间位就是 breaking 位（见上面第 6 条），
        # 而它负责打那个随产品分发的 vendor bundle —— 不该跟着"安全组"混进来。
        # 实测过：不排除时 `0.21.5 → 0.28.2` 确实被归进了本组。
        exclude-patterns: ['esbuild']
        update-types: ['minor', 'patch']

  # ── 3. admin 后台 ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      admin-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # ── 4. APP 自动化工程（app-e2e）────────────────────────────────────────────
  # ⚠️ 这个目录的改动会触发 `e2e-app.yml`（约 8 分钟模拟器 + Appium）。
  # 慢是真慢，但也是这里最该被跑一遍的地方：WebdriverIO / Appium 的升级
  # 恰恰是最容易「本地没事、CI 上找不到元素」的那类变化。
  - package-ecosystem: npm
    directory: /app-e2e
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      app-e2e-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # ── 5. Python E2E 依赖（scripts/requirements-e2e.txt）─────────────────────
  # 这个文件是钉版本的（CI 与本地同版本），Dependabot 会按 requirements 格式升级它。
  # 注意 playwright 的 Python 包与浏览器二进制是一体两面：
  # e2e-web-full.yml 的浏览器缓存 key 就是按这个文件的 hash 算的，
  # 所以升它 = 缓存自动失效 + 浏览器重装，这是设计好的（避免旧浏览器配新库的诡异失败）。
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      python-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
