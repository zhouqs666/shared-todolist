<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
<!-- 背景：v2.7.61 樱粉渐变（浅→深，与 brand rose token 对齐） -->
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#e884a8"/>
    <stop offset="55%" stop-color="#d46e94"/>
    <stop offset="100%" stop-color="#b85a7c"/>
  </linearGradient>
  <!-- 爱心：纯白到樱白（cream-50） -->
  <linearGradient id="heartGrad" x1="0%" y1="0%" x2="50%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#fffbfc"/>
  </linearGradient>
    <!-- 爱心投影（增强立体） -->
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景（圆角方块，饱和玫红） -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 单颗居中爱心（占画布约 62%，留足安全边距） -->
  <path d="M256 392s-118-70-118-146c0-41 31-70 66-70 21 0 40 11 52 28 12-17 31-28 52-28 35 0 66 29 66 70 0 76-118 146-118 146z"
        fill="url(#heartGrad)" filter="url(#heartShadow)"/>

  <!-- 高光弧线（左上，立体感） -->
  <path d="M210 206c-16 0-28 12-28 28" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
