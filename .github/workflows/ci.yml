name: CI

# 触发条件：
# - push 到 main：每次合并后验证
# - pull_request 到 main：PR 评审时验证（合并前阻断）
# - workflow_dispatch：手动触发（紧急重跑 / 调试）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限（批次 D）：本工作流只读代码。仓库默认的 GITHUB_TOKEN 权限恰好也是 read，
# 但**显式声明 > 依赖仓库默认值** —— 默认值是别人能在 Settings 里点一下改掉的东西，
# 而工作流文件里的声明会跟着代码一起被 review。
permissions:
  contents: read

# 取消旧 run：同一分支上有新 push 时，旧 run 自动取消（行业最佳实践，省 CI 资源）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node Regression + Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check readonly guards on test scripts
        # 结构性检查（铁律二）：连数据库的 scripts/test_*.mjs 必须挂 _lib-readonly-guard，
        # 否则那些「本意只读」的脚本会把写请求真打到生产库（2026-09-14 实测
        # test_sticker_wiggle.mjs 就没有守卫）。这条保证不能只靠记忆与自觉。
        # 不依赖任何依赖，纯静态扫描 → 放在最前面，秒级失败，别浪费后面的安装时间。
        run: node scripts/check-test-guards.mjs

      - name: Check E2E credential keys (three-way consistency)
        # 同一类问题的第二例：本地 .env.test 手写、什么都有，CI 生成的那份少一个键
        # 就会「本地绿 / CI 红」（2026-09-14：CI 缺 E2E_TEST_USERNAME，而 python 侧靠它登录）。
        # 这里把「代码要读的键 / 模板 / 两个工作流生成的键」三方一致性变成机器判定。
        run: node scripts/check-e2e-env-keys.mjs

      - name: Check actions are pinned to commit SHAs
        # 第三例（批次 D）：把「供应链安全」变成机器判定。
        # 仓库设置里也已开 sha_pinning_required（实测行为：未固定的那个 job 在 "Set up job"
        # 阶段直接失败，带明确报错 —— 需要真推到 runner 上才知道）。
        # 本脚本的价值有两条，第二条是那个开关**做不到**的：
        #   ① 本地/CI 秒级反馈，且直接打印「取 SHA 的命令」；
        #   ② 它查 `# vX.Y.Z` 版本注释 —— 那是 Dependabot 判断当前版本的唯一依据，
        #      缺了它 Dependabot 就看不到这个依赖，**永远不会提更新**（安全补丁静默进不来）。
        #      开关只看 SHA 长度，完全不查注释。
        # 规则见 scripts/check-actions-pinned.mjs 头部注释。
        run: node scripts/check-actions-pinned.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # playwright 浏览器约 150MB，系统依赖约 300MB，第一次慢，CI 缓存后续会快
        run: npx playwright install --with-deps chromium

      - name: Start dev server (background)
        # test_*.mjs 依赖 localhost:3000，需要先把本地服务跑起来
        run: |
          nohup npm start > /tmp/server.log 2>&1 &
          echo "Server PID: $!"
          # 轮询等待服务就绪（最多 30 秒）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::Server failed to start within 30s"
          cat /tmp/server.log
          exit 1

      - name: Run Node regression tests
        # test_*.mjs 是本地回归脚本，可独立验证纯逻辑；不连 Supabase 生产数据
        # 任何脚本退出码非 0 立即阻断整个 job
        #
        # 注意：test_sticker_wiggle.mjs 在 CI headless Chromium 下不稳定
        #（点击 #stickerEntry 后 #stickerModal 的 hidden 类不解除，本地 Mac 能过）。
        # 暂时排除，作为阶段 2「flaky 测试治理」专项修复后再加回。
        run: |
          set -e
          for f in \
            scripts/test_compress.mjs \
            scripts/test_pinch.mjs \
            scripts/test_sakura_colors.mjs \
            scripts/test_rls_migration.mjs \
            scripts/test_rpc_migration.mjs \
            scripts/test_dora_metrics.mjs \
            scripts/test_dora_migration.mjs; do
            echo "================================================"
            echo "Running: $f"
            echo "================================================"
            node "$f"
          done
          echo "All Node regression tests passed"

      - name: Version format check (semver)
        # 只校验格式 X.Y.Z，不查线上版本（避免 CI 调用 Supabase 凭据，遵循铁律一）
        # 线上版本比对留给 release.mjs 在 CD 阶段做
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package.json version: $VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $VERSION is not valid semver (X.Y.Z)"
            exit 1
          fi
          echo "Version $VERSION is valid semver"

  # ============================================================
  # Job 3: 工作流静态检查（actionlint）
  # ============================================================
  # 把「本地手跑的 lint」变成 CI 门禁：workflow 写错（表达式/上下文/依赖关系/run 块
  # shell 问题）在 PR 阶段就拦住，而不是等到某次发布才炸。
  # 本 job 也被设为 main 的 required check（见 .workbuddy/memory/cicd-handoff.md「批次 B」）。
  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint 会自动调用 shellcheck 来 lint `run:` 块；缺了它只查 YAML/表达式，
      # 而且只在 -verbose 里提一句 `Rule "shellcheck" was disabled` —— 极易被误当成「已全查」。
      # 这一步保证「run 块被 lint 了」这件事本身是可验证的（2026-09-14 本地踩过该坑）。
      - name: 确认 shellcheck 可用
        run: shellcheck --version || echo "::warning::shellcheck 不可用，run 块不会被 lint"

      # 直接下 pinned 版本的二进制，而不是 `bash <(curl .../main/scripts/...)`
      # —— 后者等于在 CI 里执行上游 main 分支的脚本，供应链上不可复现。
      - name: 安装 actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint --version

      - name: Lint workflows
        # 显式传文件列表：不传参时 actionlint 自己找目录，万一没找到会「零检查 + 退出码 0」，
        # 那种绿灯是假的。
        run: /tmp/actionlint -color .github/workflows/*.yml

  e2e-admin:
    name: Admin E2E (Playwright + Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # E2E 跑在 admin/ 子项目（被测对象），依赖「独立 Supabase 测试项目」凭据（GitHub Secrets）
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Setup Java (Allure 报告依赖 JRE)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          # 只用来「证明测试库 ≠ 生产库」（scripts/reset-test-db.mjs / check-test-env.mjs
          # 同款约定；`npm run init:test-env` 里的 RLS 自检也拿它做 fail-closed 比对）。
          # 这个地址不是秘密：它硬编码在 public/js/supabase.js 里，随客户端分发。
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          if [ -z "$E2E_SUPABASE_URL" ] || [ -z "$E2E_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::E2E secrets 未配置，跳过 E2E 测试（配好 GitHub Secrets 后自动启用）"
            exit 0
          fi
          npm run init:test-env
          npm run test:e2e

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          if [ -d allure-results ]; then
            npx allure generate allure-results --clean -o allure-report
          fi

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-report
          path: admin/allure-report
          retention-days: 14

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: admin/test-results
          retention-days: 7