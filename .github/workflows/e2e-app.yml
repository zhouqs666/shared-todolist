name: APP E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'
      - 'android/**'
      - '.github/workflows/e2e-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'
      - 'android/**'
      # 补上 workflow 自身：原来只有 push 侧有这一条，导致「只改本文件的 PR」跑不到任何 App E2E，
      # 改动只能等合并后在 main 上第一次执行 —— 与 F2 检查项「改完 workflow 必须真跑过一次」直接冲突。
      # 代价是这类 PR 会跑一次模拟器套件（~11 分钟），但这正是它该被验证的地方。
      - '.github/workflows/e2e-app.yml'

# 最小权限（批次 D）：本工作流只读代码。测试库凭据走 Secrets 注入，不需要 token 写权限。
# 仓库默认已是 read，但**显式声明 > 依赖仓库默认值**（默认值能在 Settings 里被改掉）。
permissions:
  contents: read

# 并发组：**与 e2e-web-full.yml 共用同一个仓库级组名** —— 两个工作流都写同一个 Supabase 测试库，
# 同时跑会互相干扰。实测过一次（2026-09-15）：APP E2E 跑到一半时定时全量回归开始归零测试库，
# Appium 侧随即出现 `no such element`（同一份代码在前一次的 PR 运行里是绿的）。
# 机制上说得通：归零会删掉全部贴纸 → 被测 App 添加待办时重新开奖 → 开奖 toast/特效盖住界面
# → Appium 找元素失败（web 通道里刚查过同一类"toast 盖住界面"的问题）。
#
# ⚠️ cancel-in-progress 必须是 false（不能继承原来的 true）：同名组里任何一个 run 若设为 true，
# 它启动时会把**正在跑的另一个工作流**（比如夜间全量回归）直接取消 —— 那正是我们要避免的。
# 代价：同一分支连续 push 不再互相取消，而是排队。对"共享可变测试环境"来说这是正确取舍：
# 串行化是设计，不是浪费。
concurrency:
  group: e2e-test-db
  cancel-in-progress: false

jobs:
  # ============================================================
  # Job 1: 构建测试专用 APK（build-test-apk.mjs，与本地一致）
  # ============================================================
  build:
    name: Build Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Restore keystore for release signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > love-todo.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../../love-todo.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          # 移除 heredoc 缩进
          sed -i 's/^          //' android/keystore.properties
          echo "✓ keystore.properties 已生成"

      - name: Fix Java home for CI
        run: |
          # gradle.properties 硬编码了本地 Mac 的 Java 路径，CI 上不存在
          sed -i "s|org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" android/gradle.properties
          echo "✓ Java home 已设为 $JAVA_HOME"

      - name: Generate .env.test
        # 键位与 e2e-web-full.yml 保持一致（同一个测试账号，两个通道各取所需：
        # app-e2e 的夹具用 E2E_TEST_EMAIL 反查用户名，scripts/test_*.py 直接填 E2E_TEST_USERNAME）
        run: |
          printf '%s\n' \
            "E2E_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}" \
            "E2E_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}" \
            "E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" \
            "E2E_TEST_USERNAME=${{ secrets.E2E_TEST_USERNAME }}" \
            "E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}" \
            "E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}" \
            > app-e2e/.env.test
          echo "✓ .env.test 已生成"

      - name: Build test APK (build-test-apk.mjs)
        run: node scripts/build-test-apk.mjs

      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  # ============================================================
  # Job 2: APP E2E 测试（阶段 3.6：模拟器 + Appium + 测试）
  # ============================================================
  test:
    name: APP E2E (Appium)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download test APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-apk
          path: android/app/build/outputs/apk/release/

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app-e2e/package-lock.json

      - name: Install app-e2e dependencies
        run: cd app-e2e && npm ci

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list --installed

      - name: Generate .env.test
        run: |
          printf '%s\n' \
            "E2E_SUPABASE_URL=${{ secrets.E2E_SUPABASE_URL }}" \
            "E2E_SUPABASE_ANON_KEY=${{ secrets.E2E_SUPABASE_ANON_KEY }}" \
            "E2E_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}" \
            "E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}" \
            "E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}" \
            > app-e2e/.env.test

      # 快速失败：测试库 schema 漂移会让 App 查询静默失败、E2E 报「元素找不到」，
      # 排查成本极高。这里在起模拟器之前就校验，几十秒内给出可执行的修复 SQL。
      - name: Check test DB schema (fail fast)
        run: cd app-e2e && node scripts/check-test-schema.mjs

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # 设置测试环境变量（覆盖 wdio.conf.js 的默认设备名）
            export DEVICE_NAME="emulator-5554"
            export ANDROID_HOME="$ANDROID_HOME"

            # 跑测试：外面套一层「失败重试一次」（重试原因与实测证据写在
            # app-e2e/scripts/ci-run-with-retry.sh 的文件头；真回归仍会失败，只吸收环境抖动）
            #
            # ⚠️ 这个 script 是**逐行**交给 /usr/bin/sh -c 执行的：不要在这里写跨行的
            # for/if 结构（会被拆断成语法错误 —— 2026-09-15 踩过），多行逻辑写进脚本文件。
            bash app-e2e/scripts/ci-run-with-retry.sh

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-results
          path: app-e2e/allure-results/
          retention-days: 7

      - name: Generate Allure report
        if: always()
        run: |
          cd app-e2e
          npx allure generate allure-results --clean --report-dir allure-report || true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: allure-report
          path: app-e2e/allure-report/
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failure-screenshots
          path: |
            app-e2e/allure-results/**/*.png
          retention-days: 7
