name: APP E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'
      - '.github/workflows/e2e-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/**'
      - 'app-e2e/**'

jobs:
  e2e-app:
    name: APP E2E (Appium)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-e2e/package-lock.json

      - name: Install app-e2e dependencies
        run: cd app-e2e && npm ci

      - name: Install root dependencies (for cap sync)
        run: npm install --ignore-scripts

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Build debug APK (no keystore required)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          ls -la app/build/outputs/apk/debug/*.apk || echo "WARNING: no debug APK found"

      - name: Start Appium server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium driver list --installed
          appium &>/tmp/appium.log &
          sleep 15
          curl -s http://127.0.0.1:4723/status || { echo "Appium failed to start"; cat /tmp/appium.log; exit 1; }
          echo "✓ Appium ready"

      - name: Start Android emulator
        run: |
          export ANDROID_HOME=$ANDROID_HOME
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "system-images;android-35;google_apis;x86_64"
          echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n test -k "system-images;android-35;google_apis;x86_64" -d "pixel_6" --force
          $ANDROID_HOME/emulator/emulator -avd test -no-window -no-audio -gpu swiftshader_indirect -no-snapshot-load &
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "✓ Emulator ready"

      - name: Run APP E2E tests
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          cd app-e2e
          npx wdio run ./wdio.conf.js

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-app-results
          path: app-e2e/allure-results
          retention-days: 14

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate app-e2e/allure-results --clean -o app-e2e/allure-report || true

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-screenshots
          path: app-e2e/screenshots
          retention-days: 14
