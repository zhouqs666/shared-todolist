<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fdfaf6" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>登录 · 有爱</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/login.css" />
  <style>
    @keyframes js-splash-pop{0%{opacity:0;transform:scale(0.4) translateY(20px)}60%{opacity:1;transform:scale(1.08) translateY(0)}100%{opacity:1;transform:scale(1)}}
    @keyframes js-splash-beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}60%{transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){#js-splash>div{animation:none!important}}
  </style>
</head>
<body>
  <!-- JS 爱心开屏动画（首帧即铺满，1.2s 后淡出） -->
  <div id="js-splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#fdfaf6 0%,#faf5ec 60%,#fdeee0 100%);transition:opacity 0.5s ease;pointer-events:none">
    <div style="width:120px;height:120px;animation:js-splash-pop 0.6s cubic-bezier(0.16,1,0.3,1) both, js-splash-beat 1.2s ease-in-out 0.6s">
      <svg viewBox="0 0 512 512" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
        <defs>
<linearGradient id="jsh1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fce7da"/></linearGradient>
<linearGradient id="jsh2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff8f4"/><stop offset="100%" stop-color="#f4cbb4"/></linearGradient>
        </defs>
        <path d="M256 402s-110-66-110-140.6c0-36.4 28.8-63.4 63-63.4 22.6 0 41.4 11.6 47 28.2 5.6-16.6 24.4-28.2 47-28.2 34.2 0 63 27 63 63.4C366 336 256 402 256 402z" fill="url(#jsh1)"/>
        <g transform="translate(262 248) scale(0.5)">
          <path d="M256 402s-110-66-110-140.6c0-36.4 28.8-63.4 63-63.4 22.6 0 41.4 11.6 47 28.2 5.6-16.6 24.4-28.2 47-28.2 34.2 0 63 27 63 63.4C366 336 256 402 256 402z" fill="url(#jsh2)"/>
        </g>
      </svg>
    </div>
  </div>
  <script>
    setTimeout(function () {
      var el = document.getElementById('js-splash');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
    }, 1200);
  </script>

  <main class="login">
    <div class="login__card">
      <div class="login__heart" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="64" height="64" role="img" aria-label="爱心">
          <defs>
            <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#eda984"/>
<stop offset="100%" stop-color="#d34c14"/>
            </linearGradient>
          </defs>
          <path d="M16 28s-11-6.6-11-14.2C5 9.2 7.9 6.5 11.3 6.5c2 0 3.8 1 4.7 2.6.9-1.6 2.7-2.6 4.7-2.6C24.1 6.5 27 9.2 27 13.8 27 21.4 16 28 16 28z" fill="url(#heartGrad)"/>
          <path d="M13 11c-1.6 0-3 1.3-3 3" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <h1 class="login__title">爱的清单</h1>
      <p class="login__subtitle">一起消灭琐碎事项</p>

      <form id="loginForm" class="login__form" novalidate>
        <label class="field">
          <span class="field__label">用户名</span>
          <input
            id="username"
            name="username"
            class="field__input"
            type="text"
            autocomplete="username"
            autocapitalize="none"
            required
          />
        </label>

        <label class="field">
          <span class="field__label">密码</span>
          <input
            id="password"
            name="password"
            class="field__input"
            type="password"
            autocomplete="current-password"
            required
          />
        </label>

        <p id="errorMsg" class="login__error" hidden></p>

        <button id="submitBtn" class="login__submit btn btn--primary" type="submit">
          登录
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
